name: Android CI & Build Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build:
    name: Build & Test OptiFTTH
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Mock .env File
        run: |
          cp .env.example .env || touch .env

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            cp debug.keystore app/debug.keystore || true
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp debug.keystore app/debug.keystore || true
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon -Dksp.incremental=false --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -Dksp.incremental=false --stacktrace

      - name: Prepare Named Release APK
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/*.apk release-apks/OptiFTTH-v1.0.${{ github.run_number }}.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: optiftth-debug-apk-build-${{ github.run_number }}
          path: release-apks/*.apk
          retention-days: 14

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Create GitHub Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref_name == 'main' || github.ref_name == 'master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: OptiFTTH v1.1.${{ github.run_number }}
          body: |
            ### 📱 Mise à jour OptiFTTH (Build #${{ github.run_number }})
            - **Version Code Android :** ${{ github.run_number }}
            - **Commit :** ${{ github.sha }}
            - **Branche :** ${{ github.ref_name }}
            
            **Instructions d'installation :**
            1. Téléchargez le fichier `.apk` ci-dessous (`OptiFTTH-v1.0.${{ github.run_number }}.apk`).
            2. *Note importante :* Si vous aviez une ancienne version installée avant la configuration de cette clé, désinstallez-la une première fois. Ensuite, toutes les futures versions se mettront à jour directement sans perte de données.
          files: release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
