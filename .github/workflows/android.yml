name: Android CI & Build Workflow

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test OptiFTTH
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Mock .env File
        run: |
          cp .env.example .env 2>/dev/null || touch .env

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Restore Fixed Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -f debug.keystore ]; then
            echo "Using existing debug.keystore..."
          else
            echo "Using embedded persistent debug key..."
            echo "" | base64 -d > debug.keystore
          fi
          # Placer la cle debug aux 3 emplacements pour AGP
          cp -f debug.keystore app/debug.keystore || true
          cp -f debug.keystore ~/.android/debug.keystore || true

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon -Dksp.incremental=false --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -Dksp.incremental=false --stacktrace

      - name: Prepare Named Release APK
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/*.apk release-apks/OptiFTTH-v1.0.${{ github.run_number }}.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: optiftth-debug-apk-build-${{ github.run_number }}
          path: release-apks/*.apk
          retention-days: 14

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OptiFTTH v1.0.${{ github.run_number }}
          body: |
            ### 📱 Mise à jour OptiFTTH (Build #${{ github.run_number }})
            - **Version Code Android :** ${{ github.run_number }}
            - **Commit :** ${{ github.sha }}
            - **Branche :** ${{ github.ref_name }}

            **Instructions d'installation :**
            1. Téléchargez l'APK ci-dessous (`OptiFTTH-v1.0.${{ github.run_number }}.apk`).
            2. Installez-le : les mises à jour s'appliquent directement sans désinstaller ni perdre de données grâce à la signature fixe.
          files: release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
