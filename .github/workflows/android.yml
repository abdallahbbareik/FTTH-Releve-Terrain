name: Android CI & Build Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build:
    name: Build & Test OptiFTTH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Create Mock .env File
        run: |
          cp .env.example .env || touch .env

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Run Unit & Robolectric Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon -Dksp.incremental=false --stacktrace || gradle :app:testDebugUnitTest --no-daemon -Dksp.incremental=false

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon -Dksp.incremental=false --stacktrace || gradle :app:assembleDebug --no-daemon -Dksp.incremental=false

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: optiftth-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
